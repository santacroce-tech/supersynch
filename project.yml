name: SuperSynch
options:
  bundleIdPrefix: xyz.santacroce
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  # Shared, idiom-agnostic core: models, networking, persistence, live-update
  # engine and view models. Both iPhone and iPad use this verbatim.
  SyncthingKit:
    type: framework
    platform: iOS
    sources:
      - path: SyncthingKit/Sources
      - path: SyncthingKit/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.santacroce.SyncthingKit
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES

  SuperSynch:
    type: application
    platform: iOS
    sources:
      - path: SuperSynch
    dependencies:
      - target: SyncthingKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.santacroce.SuperSynch
        PRODUCT_NAME: SuperSynch
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SuperSynch
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "SuperSynch connects to Syncthing instances on your local network."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: SuperSynch/Resources/Info.plist
      properties:
        # Plain HTTP is permitted only for local-network hosts (.local,
        # unqualified names, IP addresses). Remote hosts must use HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  SyncthingKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SyncthingKitTests
    dependencies:
      - target: SyncthingKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.santacroce.SyncthingKitTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SuperSynch:
    build:
      targets:
        SuperSynch: all
        SyncthingKit: all
    test:
      targets:
        - SyncthingKitTests
      gatherCoverageData: true
    run:
      config: Debug
